name: Continuous Integration and Deployment

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.x"
          - os: windows-latest
            python-version: "3.x"

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup build and test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
      - name: Build Python Package
        run: |
          python -m pip install ".[tests]"
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 --show-source src/ tests/
      - name: Check Manifest
        run: |
          pip install check-manifest
          check-manifest
      - name: Test with pytest
        run: |
          coverage run --parallel -m pytest
      - name: Report code coverage
        run: |
          coverage combine
          coverage report
          coverage xml

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
      - name: Setup docs environment
        run: |
          python -m pip install ".[docs]"
      - name: Build documentation with sphinx
        run: |
          sphinx-build -W -b html -d doctrees docs/source docs/_build/html

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  publish:
    needs: [build, docs, lockfile]
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
      - name: Build Package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish Package on PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          user: __token__
          password: ${{ secrets.pypi_token }}
